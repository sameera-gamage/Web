<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="room4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17130d"/>
      <stop offset="1" stop-color="#0d0b08"/>
    </linearGradient>
    <linearGradient id="ocean4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fb7c2"/>
      <stop offset="0.5" stop-color="#4d7f89"/>
      <stop offset="1" stop-color="#2c525a"/>
    </linearGradient>
    <linearGradient id="floor4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2118"/>
      <stop offset="1" stop-color="#0f0c08"/>
    </linearGradient>
    <radialGradient id="warm4" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#D8AF71" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#D8AF71" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#room4)"/>
  <!-- interior side walls framing the view (the door opening) -->
  <path d="M0 0 L470 150 L470 850 L0 1000 Z" fill="#100d09"/>
  <path d="M1600 0 L1130 150 L1130 850 L1600 1000 Z" fill="#100d09"/>
  <!-- ocean view through the glass -->
  <rect x="470" y="150" width="660" height="560" fill="url(#ocean4)"/>
  <!-- horizon + surf lines -->
  <rect x="470" y="360" width="660" height="4" fill="#e8f2f4" opacity="0.5"/>
  <rect x="470" y="470" width="660" height="30" fill="#dfeef0" opacity="0.18"/>
  <rect x="470" y="560" width="660" height="40" fill="#dfeef0" opacity="0.14"/>
  <!-- glass mullions -->
  <g stroke="#0d0b08" stroke-width="10" opacity="0.7">
    <line x1="690" y1="150" x2="690" y2="710"/>
    <line x1="910" y1="150" x2="910" y2="710"/>
  </g>
  <!-- warm floor -->
  <path d="M470 710 L1130 710 L1600 1000 L0 1000 Z" fill="url(#floor4)"/>
  <rect width="1600" height="1000" fill="url(#warm4)"/>
</svg>
